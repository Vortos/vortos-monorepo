name: Monorepo Split

on:
  push:
    branches:
      - main
    tags:
      - '*'

# Least privilege by default. The `split` job pushes to the per-package repos using its own PAT
# (MONOREPO_SPLIT_TOKEN), NOT the workflow's GITHUB_TOKEN, so no job needs a write-scoped default
# token. Any future job that needs more must opt in explicitly at the job level.
permissions:
  contents: read

jobs:
  pin-lint:
    # Supply-chain gate: every action in every workflow must be pinned to an immutable commit SHA.
    # This guards against a future hand-edit reintroducing a mutable `@v4`/`@main` tag (the privileged
    # `split` job below holds a PAT that can push to ~45 package repos, so an unpinned action here is
    # a direct path to that token).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: Lint action pins
        run: bash tools/ci/lint-action-pins.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.5'
          extensions: redis
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-reqs

      - name: Run tests
        run: ./vendor/bin/phpunit --testdox

  benchmark:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.5'
          extensions: redis, opcache
          coverage: none
          ini-values: 'opcache.enable_cli=1,opcache.jit=tracing,opcache.jit_buffer_size=64M'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-reqs

      - name: Run benchmarks (SLO assertion)
        run: ./vendor/bin/phpbench run packages/Vortos/src/FeatureFlags/Tests/Benchmark --report=aggregate --retry-threshold=5

  ui-build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/feature-flags-admin/package.json

      - name: Install JS dependencies
        run: npm install
        working-directory: packages/feature-flags-admin

      - name: Type-check
        run: npm run typecheck
        working-directory: packages/feature-flags-admin

      - name: Build islands bundle
        run: npm run build
        working-directory: packages/feature-flags-admin

  split:
    needs: [pin-lint, tests, ui-build]
    runs-on: ubuntu-latest
    # Serialise per PACKAGE REPO, not per workflow run.
    #
    # Pushing `main` and a tag together starts two runs, and their jobs for the same package race
    # each other pushing `main` to that package's split repo. The loser fails with
    # `! [remote rejected] main -> main (cannot lock ref 'refs/heads/main')`, which makes a release
    # that mostly succeeded look failed and can leave one package's tag unpublished — so a
    # perfectly good `composer update` then resolves to a version that does not exist yet.
    #
    # cancel-in-progress is false on purpose: both runs carry real work (a branch push and a tag
    # push produce different refs downstream), so they must queue, never drop.
    concurrency:
      group: split-${{ matrix.package.split_repository }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        package:
          - local_path: 'packages/Vortos/src/Domain'
            split_repository: 'vortos-domain'
          - local_path: 'packages/Vortos/src/Foundation'
            split_repository: 'vortos-foundation'
          - local_path: 'packages/Vortos/src/Http'
            split_repository: 'vortos-http'
          - local_path: 'packages/Vortos/src/Logger'
            split_repository: 'vortos-logger'
          - local_path: 'packages/Vortos/src/Cache'
            split_repository: 'vortos-cache'
          - local_path: 'packages/Vortos/src/Tracing'
            split_repository: 'vortos-tracing'
          - local_path: 'packages/Vortos/src/Persistence'
            split_repository: 'vortos-persistence'
          - local_path: 'packages/Vortos/src/PersistenceDbal'
            split_repository: 'vortos-persistence-dbal'
          - local_path: 'packages/Vortos/src/PersistenceOrm'
            split_repository: 'vortos-persistence-orm'
          - local_path: 'packages/Vortos/src/PersistenceMongo'
            split_repository: 'vortos-persistence-mongo'
          - local_path: 'packages/Vortos/src/Messaging'
            split_repository: 'vortos-messaging'
          - local_path: 'packages/Vortos/src/Cqrs'
            split_repository: 'vortos-cqrs'
          - local_path: 'packages/Vortos/src/Auth'
            split_repository: 'vortos-auth'
          - local_path: 'packages/Vortos/src/Authorization'
            split_repository: 'vortos-authorization'
          - local_path: 'packages/Vortos/src/Docker'
            split_repository: 'vortos-docker'
          - local_path: 'packages/Vortos'
            split_repository: 'vortos-framework'
          - local_path: 'packages/Vortos/src/Migration'
            split_repository: 'vortos-migration'
          - local_path: 'packages/Vortos/src/Make'
            split_repository: 'vortos-make'
          - local_path: 'packages/Vortos/src/Debug'
            split_repository: 'vortos-debug'
          - local_path: 'packages/Vortos/src/FeatureFlags'
            split_repository: 'vortos-feature-flags'
          - local_path: 'packages/Vortos/src/FeatureFlagsAdmin'
            split_repository: 'vortos-feature-flags-admin'
          - local_path: 'packages/Vortos/src/Setup'
            split_repository: 'vortos-setup'
          - local_path: 'packages/Vortos/src/Metrics'
            split_repository: 'vortos-metrics'
          - local_path: 'packages/Vortos/src/Config'
            split_repository: 'vortos-config'
          - local_path: 'packages/Vortos/src/Security'
            split_repository: 'vortos-security'
          - local_path: 'packages/Vortos/src/Mcp'
            split_repository: 'vortos-mcp'
          - local_path: 'packages/Vortos/src/Observability'
            split_repository: 'vortos-observability'
          - local_path: 'packages/Vortos/src/AwsSes'
            split_repository: 'vortos-aws-ses'
          - local_path: 'packages/Vortos/src/ObjectStore'
            split_repository: 'vortos-object-store'
          - local_path: 'packages/Vortos/src/Paddle'
            split_repository: 'vortos-paddle'
          - local_path: 'packages/Vortos/src/Push'
            split_repository: 'vortos-push'
          - local_path: 'packages/Vortos/src/Sse'
            split_repository: 'vortos-sse'
          - local_path: 'packages/Vortos/src/Iac'
            split_repository: 'vortos-iac'
          - local_path: 'packages/Vortos/src/Tenant'
            split_repository: 'vortos-tenant'
          - local_path: 'packages/Vortos/src/Pipeline'
            split_repository: 'vortos-pipeline'
          - local_path: 'packages/Vortos/src/Alerts'
            split_repository: 'vortos-alerts'
          - local_path: 'packages/Vortos/src/Analytics'
            split_repository: 'vortos-analytics'
          - local_path: 'packages/Vortos/src/AnalyticsPosthog'
            split_repository: 'vortos-analytics-posthog'
          - local_path: 'packages/Vortos/src/Backup'
            split_repository: 'vortos-backup'
          - local_path: 'packages/Vortos/src/Deploy'
            split_repository: 'vortos-deploy'
          - local_path: 'packages/Vortos/src/DeployK8s'
            split_repository: 'vortos-deploy-k8s'
          - local_path: 'packages/Vortos/src/Health'
            split_repository: 'vortos-health'
          - local_path: 'packages/Vortos/src/OpsKit'
            split_repository: 'vortos-ops-kit'
          - local_path: 'packages/Vortos/src/Release'
            split_repository: 'vortos-release'
          - local_path: 'packages/Vortos/src/Secrets'
            split_repository: 'vortos-secrets'
          - local_path: 'packages/Vortos/src/Scheduler'
            split_repository: 'vortos-scheduler'
          - local_path: 'packages/Vortos/src/SchedulerAdmin'
            split_repository: 'vortos-scheduler-admin'
          - local_path: 'packages/Vortos/src/Search'
            split_repository: 'vortos-search'
          - local_path: 'packages/Vortos/src/Audit'
            split_repository: 'vortos-audit'
          - local_path: 'packages/Vortos/src/AuditAdmin'
            split_repository: 'vortos-audit-admin'

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0

      # The meta-package ships the source tree that the container globs for service
      # discovery, while PSR-4 loads each class from its own split package. A floating
      # `^1.0` therefore lets discovery and implementation resolve to different releases
      # — an install was seen with 43 packages at alpha-269 and framework at alpha-270.
      # Pinning at release time makes them the same commit by construction.
      - name: Pin meta-package requires to this release
        if: matrix.package.split_repository == 'vortos-framework' && github.ref_type == 'tag'
        run: php tools/ci/pin-meta-requires.php "${{ github.ref_name }}"

      # The split action is a Docker action whose Dockerfile does `FROM php:8.1-cli-alpine`, and
      # ~55 of these jobs start at once. Docker Hub rate-limits and times out under that fan-out,
      # which failed two releases in one hour with `DeadlineExceeded ... registry-1.docker.io`.
      # Nothing was wrong with the code either time; a re-run passed unchanged.
      #
      # The action is third-party, so its Dockerfile is not ours to edit. Instead the base image is
      # pulled here with backoff, and BuildKit is disabled for the job: the legacy builder resolves
      # `FROM` against the local image store, so the action's build no longer contacts the registry
      # at all. BuildKit always issues a HEAD to the registry even when the image is present
      # locally, which is precisely the request that was timing out.
      - name: Pre-pull the split action's base image
        env:
          DOCKER_BUILDKIT: '0'
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull --quiet php:8.1-cli-alpine; then
              exit 0
            fi
            echo "pull attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "could not pull php:8.1-cli-alpine after 5 attempts" >&2
          exit 1

      - uses: danharrin/monorepo-split-github-action@14e42e2437f674b8987c1f50ca3689116aea1893  # v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}
          DOCKER_BUILDKIT: '0'
        with:
          package_directory: ${{ matrix.package.local_path }}
          repository_organization: 'Vortos'
          repository_name: ${{ matrix.package.split_repository }}
          user_name: 'Sachintha De Silva'
          user_email: 'yslaksura@gmail.com'
          tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          branch: ${{ github.ref_type == 'branch' && github.ref_name || 'main' }}